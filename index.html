<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bugfinn Pattern Manager</title>
<style>
:root{
 --pink:#b9828f;--pink2:#ead5da;--pink3:#fff7f8;--dark:#49363b;
 --muted:#8b7379;--white:#fff;--border:#eadde0;--shadow:0 8px 25px rgba(110,70,80,.09);
 --danger:#d9534f;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans Thai",sans-serif;background:#faf7f8;color:var(--dark)}
button,input,textarea,select{font:inherit}
.header{background:linear-gradient(135deg,#b9828f,#c996a2);color:#fff;padding:28px 22px}
.header-inner{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center}
h1{margin:0 0 7px;font-size:27px}.sub{opacity:.9}
.container{max-width:1200px;margin:22px auto;padding:0 18px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.search{flex:1;min-width:240px;padding:13px 16px;border:1px solid var(--border);border-radius:13px;background:white;outline:none}
.btn{border:0;border-radius:12px;padding:12px 16px;cursor:pointer;font-weight:700}
.btn-primary{background:var(--pink);color:#fff}.btn-light{background:#fff;border:1px solid var(--border);color:var(--dark)}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--border)}
.categories{display:flex;gap:8px;overflow:auto;padding-bottom:12px}
.cat{white-space:nowrap;border:1px solid var(--border);background:#fff;padding:9px 13px;border-radius:999px;cursor:pointer}
.cat.active{background:var(--pink);color:#fff;border-color:var(--pink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:15px}
.card{background:#fff;border:1px solid var(--border);border-radius:17px;padding:17px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:220px}
.card-top{display:flex;justify-content:space-between;gap:10px}.title{font-weight:800;font-size:17px;line-height:1.4}
.badge{font-size:12px;background:var(--pink3);color:var(--pink);padding:5px 9px;border-radius:8px;white-space:nowrap}
.content{white-space:pre-wrap;line-height:1.65;color:#5d4b50;margin:12px 0;display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.actions{display:flex;gap:6px;margin-top:10px}.actions button{flex:1}
.star{background:none;border:0;font-size:21px;cursor:pointer;color:#c5a5ad}.star.on{color:#d29b2f}
.empty{text-align:center;padding:55px 20px;color:var(--muted)}
.modal{display:none;position:fixed;inset:0;background:rgba(55,35,40,.4);align-items:center;justify-content:center;padding:15px;z-index:10}
.modal.show{display:flex}.modal-box{background:#fff;width:min(700px,100%);max-height:90vh;overflow:auto;border-radius:20px;padding:22px}
label{display:block;font-weight:700;margin:12px 0 7px}input,textarea,select{width:100%;padding:12px;border:1px solid var(--border);border-radius:11px;outline:none}textarea{min-height:230px;resize:vertical}
.modal-actions{display:flex;gap:9px;margin-top:16px}.modal-actions button{flex:1}
.toast{position:fixed;right:20px;bottom:20px;background:#49363b;color:white;padding:12px 17px;border-radius:12px;display:none;z-index:20}
@media(max-width:600px){h1{font-size:23px}.grid{grid-template-columns:1fr}.container{padding:0 12px}.header{padding:22px 16px}}
</style>
</head>
<body>
<header class="header">
 <div class="header-inner">
 <div>
 <h1>💗 Bugfinn Pattern Manager</h1>
 <div class="sub">คลังข้อความสำหรับงานแอดมิน • ค้นหาและคัดลอกไปใช้ในแชทได้ทันที</div>
 </div>
 <button class="btn btn-light" style="font-size:12px" onclick="resetData()">↺ รีเซ็ตข้อมูล</button>
 </div>
</header>


<main class="container">
<div class="toolbar">
<input id="search" class="search" placeholder="🔍 ค้นหา เช่น ดาวน์, NPL, iPhone, เอกสาร...">
<button type="button" id="addPatternBtn" class="btn btn-primary">＋ เพิ่ม Pattern</button>
</div>
<div id="cats" class="categories"></div>
<div id="grid" class="grid"></div>
</main>


<div id="modal" class="modal">
<div class="modal-box">
<h2 id="modalTitle">เพิ่ม Pattern</h2>
<input type="hidden" id="editId">
<label>ชื่อ Pattern</label><input id="name" placeholder="เช่น แจ้งลูกค้าเครดิตผ่าน">
<label>หมวดหมู่</label>
<select id="category"></select>
<label>ข้อความ Pattern</label><textarea id="content" placeholder="ใส่ข้อความที่ต้องการคัดลอก..."></textarea>
<div class="modal-actions"><button type="button" id="cancelModalBtn" class="btn btn-light">ยกเลิก</button><button type="button" id="savePatternBtn" class="btn btn-primary">บันทึก</button></div>
</div></div>
<div id="toast" class="toast">คัดลอกแล้ว ✓</div>

let data = [];
let active="ทั้งหมด";
const $=id=>document.getElementById(id);
 async function loadPatterns(){
  try{
    const response = await fetch("patterns.json?v=" + Date.now());
    if(!response.ok) throw new Error("โหลด patterns.json ไม่สำเร็จ");
    const serverData = await response.json();
    const favoriteIds = JSON.parse(localStorage.getItem("bugfinn_favorites") || "[]");
    const localPatterns = JSON.parse(localStorage.getItem("bugfinn_patterns") || "null");
    if(Array.isArray(localPatterns)){
      data = localPatterns;
    }else{
      data = serverData.map(x => ({...x, fav: favoriteIds.includes(x.id)}));
    }
  }catch(error){
    console.warn("ใช้ข้อมูลเริ่มต้นแทน patterns.json", error);
    const favoriteIds = JSON.parse(localStorage.getItem("bugfinn_favorites") || "[]");
    const localPatterns = JSON.parse(localStorage.getItem("bugfinn_patterns") || "null");
    data = Array.isArray(localPatterns) ? localPatterns : initial.map(x => ({...x, fav: favoriteIds.includes(x.id)}));
  }
  render();
}


function saveLocal(){
  localStorage.setItem("bugfinn_patterns", JSON.stringify(data));
  localStorage.setItem("bugfinn_favorites", JSON.stringify(data.filter(x=>x.fav).map(x=>x.id)));
}


function populateCategorySelect(){
 const cats = Array.from(new Set([...defaultCategories, ...data.map(x=>x.category)]));
 $("category").innerHTML = cats.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join("");
}


function categories(){
 const cats=["ทั้งหมด", "⭐ รายการโปรด", ...new Set([...defaultCategories, ...data.map(x=>x.category)])];
 $("cats").innerHTML=cats.map(c=>`<button class="cat ${c===active?'active':''}" onclick="setCat(${JSON.stringify(c)})">${c}</button>`).join("");
}


function setCat(c){active=c;render()}


function render(){
 categories();
 populateCategorySelect();
 const q=$("search").value.toLowerCase().trim();
 const list=data.filter(x=>{
 const matchCat = active==="ทั้งหมด" ? true : (active==="⭐ รายการโปรด" ? x.fav : x.category===active);
 const matchSearch = !q || (x.name+" "+x.category+" "+x.content).toLowerCase().includes(q);
 return matchCat && matchSearch;
 });


 $("grid").innerHTML=list.length?list.map(x=>`
  <article class="card">
    <div class="card-top"><div class="title">${esc(x.name)}</div><button class="star ${x.fav?'on':''}" onclick="toggleFav('${x.id}')">${x.fav?'★':'☆'}</button></div>
    <div><span class="badge">${esc(x.category)}</span></div>
    <div class="content">${esc(x.content)}</div>
    <div class="actions">
      <button class="btn btn-primary" onclick="copyText('${x.id}')">📋 คัดลอก</button>
      <button class="btn btn-light" onclick="editPattern('${x.id}')">✏️ แก้ไข</button>
      <button class="btn btn-danger" onclick="deletePattern('${x.id}')">🗑️ลบ</button>
    </div>
  </article>`).join(""):`<div class="empty">ไม่พบ Pattern ที่ค้นหา</div>`;
}


function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}


async function copyText(id){
 const x=data.find(a=>a.id===id);
 try{await navigator.clipboard.writeText(x.content)}catch(e){const t=document.createElement("textarea");t.value=x.content;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove()}
 $("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",1400)
}


function toggleFav(id){
 const x = data.find(a => a.id === id);
 x.fav = !x.fav;
 saveLocal();
 render();
}

function openModal(){
  $("modalTitle").textContent="เพิ่ม Pattern";
  $("editId").value="";
  $("name").value="";
  $("content").value="";
  populateCategorySelect();
  if($("category").options.length) $("category").selectedIndex=0;
  $("modal").classList.add("show");
  setTimeout(()=>$("name").focus(),50);
}

function savePattern(){
  const name = $("name").value.trim();
  const content = $("content").value.trim();
  const category = $("category").value;
  const id = $("editId").value;

  if(!name || !content){
    alert("กรุณากรอกชื่อและข้อความ Pattern");
    return;
  }

 
  if(id){
    const item = data.find(x => x.id === id);

    if(item){
      Object.assign(item, {
        name,
        content,
        category
      });
    }

    saveLocal();
    closeModal();
    render();
    return;
  }

  const issueTitle = `[PATTERN] ${name}`;

  const issueBody =
`### ชื่อ Pattern
${name}

### หมวดหมู่
${category || "ทั่วไป"}

### ข้อความ Pattern
${content}
`;

 
  const owner = "BimintandPalm";
  const repo = "index.html";

  const issueUrl =
    `https://github.com/${owner}/${repo}/issues/new` +
    `?title=${encodeURIComponent(issueTitle)}` +
    `&body=${encodeURIComponent(issueBody)}`;

  window.location.href = issueUrl;
}


function editPattern(id){
 const x=data.find(a=>a.id===id);
 $("modalTitle").textContent="แก้ไข Pattern";$("editId").value=id;$("name").value=x.name;$("content").value=x.content;$("category").value=x.category;
 $("modal").classList.add("show");
}


function deletePattern(id){
 if(confirm("คุณต้องการลบ Pattern นี้ใช่หรือไม่?")){
 data = data.filter(x=>x.id!==id);
 saveLocal();
 render();
 }
}


function resetData(){
 if(confirm("คุณต้องการล้างข้อมูลที่แก้ไข/เพิ่มไว้ และรีเซ็ตเป็นข้อมูลเริ่มต้นใช่หรือไม่?")){
   localStorage.removeItem("bugfinn_patterns");
   localStorage.removeItem("bugfinn_favorites");
   data = initial.map(x=>({...x}));
   active = "ทั้งหมด";
   $("search").value = "";
   render();
 }
}


function closeModal(){$("modal").classList.remove("show")}



document.addEventListener("DOMContentLoaded",()=>{
  $("addPatternBtn").addEventListener("click", openModal);
  $("cancelModalBtn").addEventListener("click", closeModal);
  $("savePatternBtn").addEventListener("click", savePattern);
  $("search").addEventListener("input",render);
  $("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
  loadPatterns();
});
</script>
</body>
</html>
