name: Add Pattern

on:
  issues:
    types:
      - opened

permissions:
  contents: write
  issues: write

jobs:
  add-pattern:
    if: startsWith(github.event.issue.title, "[PATTERN]")
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Parse Pattern
        id: pattern
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 <<'PY'
          import os
          import re
          import json

          body = os.environ.get("ISSUE_BODY", "")

          def get_field(name):
              pattern = rf"### {re.escape(name)}\s*\n\s*(.*?)(?=\n### |\Z)"
              m = re.search(pattern, body, re.S)
              return m.group(1).strip() if m else ""

          name = get_field("ชื่อ Pattern")
          category = get_field("หมวดหมู่")
          content = get_field("ข้อความ Pattern")

          if not name or not content:
              raise SystemExit("Pattern data is incomplete")

          # ป้องกัน path traversal
          safe_name = re.sub(r"[^a-zA-Z0-9ก-๙_-]+", "-", name).strip("-")
          if not safe_name:
              safe_name = "pattern"

          # จำกัดความยาวชื่อไฟล์
          safe_name = safe_name[:80]

          output = {
              "name": name,
              "category": category or "ทั่วไป",
              "content": content,
              "fav": False
          }

          with open("/tmp/pattern.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          with open("/tmp/pattern_name", "w", encoding="utf-8") as f:
              f.write(safe_name)

          print("Pattern:", name)
          print("Category:", category)
          PY

      - name: Create Pattern File
        run: |
          mkdir -p data/patterns

          NAME=$(cat /tmp/pattern_name)

          # ป้องกันชื่อซ้ำ
          FILE="data/patterns/${NAME}.json"

          if [ -f "$FILE" ]; then
            FILE="data/patterns/${NAME}-${GITHUB_RUN_NUMBER}.json"
          fi

          cp /tmp/pattern.json "$FILE"

          echo "Created: $FILE"

      - name: Commit Pattern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/patterns/

          git commit -m "Add Pattern from issue #${{ github.event.issue.number }}"

          git push

      - name: Close Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close ${{ github.event.issue.number }} \
            --repo "${{ github.repository }}" \
            --comment "✅ เพิ่ม Pattern เรียบร้อยแล้ว"
