name: Add Pattern from Issue

on:
  issues:
    types:
      - opened

permissions:
  contents: write
  issues: write

jobs:
  add-pattern:
    if: startsWith(github.event.issue.title, '[PATTERN]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update patterns.json
        id: parse_pattern
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 << 'PY'
          import os
          import re
          import json
          import time

          body = os.environ.get("ISSUE_BODY", "")

          def get_field(name):
              pattern = rf"### {re.escape(name)}\s*\n\s*(.*?)(?=\n### |\Z)"
              m = re.search(pattern, body, re.S)
              return m.group(1).strip() if m else ""

          name = get_field("ชื่อ Pattern")
          category = get_field("หมวดหมู่")
          content = get_field("ข้อความ Pattern")

          if not name or not content:
              print("::error::Pattern data is incomplete")
              raise SystemExit(1)

          file_path = "patterns.json"
          patterns = []
          if os.path.exists(file_path):
              try:
                  with open(file_path, "r", encoding="utf-8") as f:
                      patterns = json.load(f)
              except Exception as e:
                  print(f"Error reading {file_path}: {e}")
                  patterns = []

          # ตรวจสอบว่ามี Pattern ชื่อนี้อยู่แล้วหรือไม่ ถ้ามีให้อัปเดต ถ้าไม่มีให้แทรกใหม่
          existing = next((p for p in patterns if p.get("name") == name), None)
          if existing:
              existing["category"] = category or existing.get("category", "📌 อื่น ๆ")
              existing["content"] = content
          else:
              new_item = {
                  "id": f"p_{int(time.time())}",
                  "name": name,
                  "category": category or "📌 อื่น ๆ",
                  "content": content,
                  "fav": False
              }
              patterns.insert(0, new_item)

          with open(file_path, "w", encoding="utf-8") as f:
              json.dump(patterns, f, ensure_ascii=False, indent=2)

          print(f"Successfully processed pattern: {name}")
          PY

      - name: Commit & Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patterns.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-add pattern from Issue #${{ github.event.issue.number }}" && git push)

      - name: Close Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close ${{ github.event.issue.number }} \
            --repo "${{ github.repository }}" \
            --comment "✅ เพิ่ม Pattern ลงในระบบ patterns.json เรียบร้อยแล้ว ทุกคนจะเห็นข้อมูลใหม่ในอีกประมาณ 1 นาทีครับ"
